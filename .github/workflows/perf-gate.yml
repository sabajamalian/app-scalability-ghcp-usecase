name: Performance gate

# Runs on pull requests and on demand only, never on push to the default branch.
#
# That is deliberate. This repository ships with the performance defects still in
# place, so this workflow is EXPECTED TO FAIL on a clean clone. Running it on
# main would leave the default branch permanently red for a demo repo, which
# teaches the wrong lesson.
#
# In your own repository, once the fixes are in, you would run this on push to
# main as well.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-count-gate:
    name: SQL statement count must stay bounded (red until you apply the fix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers starts PostgreSQL 17 from the test itself, so there is no
      # service container to configure here. The Docker daemon is already
      # available on ubuntu-latest.
      - name: Run the query-count regression test
        working-directory: backend
        run: mvn -B test

      - name: Explain the failure
        if: failure()
        run: |
          echo "::error::A request issued more SQL statements than the budget allows."

          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## This red X is the demo working

          This repository ships with the N+1 defect still in place, so this gate
          is **supposed to fail on a clean clone**. Nothing is misconfigured.

          `GET /api/orders` issued 121 SQL statements for 40 orders against a
          budget of 10. The count scales with row count: the same endpoint issues
          219 statements against the full seeded dataset.

          ### Why this job exists

          The instruction files in `.github/` tell Copilot what good looks like,
          but instructions are advisory. A model can ignore them and a reviewer
          can miss the regression. This job is the part that cannot be talked out
          of its opinion.

          ### Turn it green

          Apply the fix from the walkthrough, then push again.

          | | |
          | --- | --- |
          | Reproduce locally | `make up && make measure-1` |
          | Run the gate locally | `make test` |
          | Walkthrough | [`docs/01-scenario-n-plus-one.md`](docs/01-scenario-n-plus-one.md) |
          | Why CI, not just instructions | [`docs/04-ci-enforcement.md`](docs/04-ci-enforcement.md) |
          SUMMARY

      - name: Confirm the gate passed
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Query-count gate passed

          `GET /api/orders` stayed within its statement budget. If you just applied
          the N+1 fix, this is the check that proves it held, and the check that
          will catch it the next time someone reintroduces it.
          SUMMARY

  load-test:
    name: k6 smoke (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build db backend

      - name: Wait for the backend
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy in time"
          docker compose logs backend | tail -50
          exit 1

      # k6 exits 99 when a threshold is crossed, and in the baseline state both
      # scenarios cross theirs on purpose. This job exists to produce numbers,
      # not to gate, so a threshold failure must not turn it red. Genuine
      # infrastructure problems still fail the "Wait for the backend" step above.
      - name: Load test scenario 1
        continue-on-error: true
        run: docker compose run --rm k6 run /scripts/scenario-1-orders.js

      - name: Load test scenario 2
        continue-on-error: true
        run: docker compose run --rm k6 run /scripts/scenario-2-search.js

      - name: Tear down
        if: always()
        run: docker compose down -v
