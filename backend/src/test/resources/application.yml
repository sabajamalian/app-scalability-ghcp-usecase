spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.example.scaledemo.api.QueryCountInspector
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: WARN
