server:
  port: 8080

spring:
  application:
    name: scaledemo-backend

  # Java 25 LTS includes JEP 491, which removed virtual-thread pinning inside
  # synchronized blocks. Before JDK 24 that pinning was a genuine throughput
  # ceiling and the standard advice was to rewrite synchronized as ReentrantLock.
  # That advice is now obsolete, which is a good example of why a stale training
  # cut-off matters when you ask an assistant for performance guidance.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scaledemo}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
    hikari:
      # Deliberately small, and correct. HikariCP's own guidance is that pools
      # should be small: roughly (cores * 2) + effective spindles. The invariant
      # that actually breaks systems is:
      #
      #     max replicas * pool size <= PostgreSQL max_connections budget
      #
      # Ten here leaves plenty of headroom against the default max_connections
      # of 100 even if you scale the backend to several replicas.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: scaledemo-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Makes the demo self-evidencing: every response reports how many SQL
        # statements produced it.
        session_factory:
          statement_inspector: com.example.scaledemo.api.QueryCountInspector
        generate_statistics: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    # Leave this on. Seeing the same SELECT scroll past 50 times is what makes
    # scenario 1 click for most people.
    org.hibernate.SQL: DEBUG
